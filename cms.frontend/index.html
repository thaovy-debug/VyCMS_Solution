<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Nhập liên kết thư viện CSS Bootstrap 4 để sử dụng hệ thống dàn trang và nút bấm giao diện -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Nhập liên kết thư viện CSS FontAwesome 6 để hiển thị các biểu tượng icon trên giao diện -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>cms.frontend</title>
  </head>
  <body>
    <div id="error-display" style="color: red; padding: 20px; font-family: monospace; z-index: 9999; position: fixed; background: white; width: 100%; top: 0; display: none;"></div>
    <script>
      window.addEventListener('error', function(event) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += event.error ? event.error.stack : event.message + '\n';
      });
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-display').style.display = 'block';
        document.getElementById('error-display').innerText += event.reason ? event.reason.stack : event.reason + '\n';
      });
    </script>
    <div id="root"></div>
    <!-- Cần jQuery và Bootstrap JS để các hiệu ứng Carousel (Slider) hoạt động -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
